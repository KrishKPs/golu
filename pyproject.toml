[project]
name = "golu"
version = "0.1.0"
description = "A command-line AI coding assistant with grounded, cited documentation answers."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.11.0",
    "chromadb>=1.5.9",
    "mcp>=2.3.0",
    "rich>=15.0.0",
    "typer>=0.27.2",
]

[project.scripts]
golu = "golu.cli:app"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]
